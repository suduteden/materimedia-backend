<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Over materimedia.</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --accent-color: #e50914;
            --card-bg: #f9f9f9;
            --border-color: #e0e0e0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            letter-spacing: -1px;
        }
        .subtag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        select, textarea, input[type="range"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #fff;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .slider-value {
            min-width: 45px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        button {
            width: 100%;
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #333;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .audio-result {
            margin-top: 20px;
            text-align: center;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="subtag">Presenter Materimedia.</div>
            <h1>Voice Over materimedia.</h1>
            <p style="color: #555;">Ubah Teks Menjadi Suara Berkualitas Studio dalam Hitungan Detik</p>
        </div>

        <div class="card">
            <h2 style="margin-top:0;">Buat Suaramu Disini</h2>
            <p style="font-size:0.85rem; color:#666; margin-bottom:20px;">Sampaikan Pesan Lebih Jelas, Lebih Persuasif, dan Berkelas</p>

            <div class="form-group">
                <label for="characterSelect">Karakter Suara</label>
                <select id="characterSelect">
                    <option value="Nain">Nain (Pria - Wibawa & Berwibawa)</option>
                    <option value="Dzul">Dzul (Pria - Tegas)</option>
                    <option value="Rayyan">Rayyan (Pria - Energik)</option>
                    <option value="Amar">Amar (Pria - Berat/Deep)</option>
                    <option value="Ramy">Ramy (Pria - Natural)</option>
                    <option value="Mawar">Mawar (Wanita - Profesional)</option>
                    <option value="Khilwa">Khilwa (Wanita - Ceria/High)</option>
                    <option value="Tsurayya">Tsurayya (Wanita - Tenang)</option>
                    <option value="Putri">Putri (Wanita - Informatif)</option>
                    <option value="Naina">Naina (Wanita - Soft)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="emotionSelect">Gaya Bicara & Emosi</label>
                <select id="emotionSelect">
                    <option value="Profesional">Profesional</option>
                    <option value="Bersemangat">Bersemangat</option>
                    <option value="Ceria">Ceria</option>
                    <option value="Sedih">Sedih</option>
                    <option value="Marah">Marah</option>
                    <option value="Informatif">Informatif</option>
                    <option value="Berbisik">Berbisik</option>
                    <option value="Tenang">Tenang</option>
                    <option value="Dramatis">Dramatis</option>
                    <option value="Santai">Santai</option>
                </select>
            </div>

            <div class="form-group">
                <label>KECEPATAN BICARA (%)</label>
                <div class="slider-container">
                    <input type="range" id="speedSlider" min="-50" max="50" value="0">
                    <span class="slider-value" id="speedVal">0</span>
                </div>
            </div>

            <div class="form-group">
                <label>NADA VOKAL (HZ)</label>
                <div class="slider-container">
                    <input type="range" id="pitchSlider" min="-30" max="30" value="0">
                    <span class="slider-value" id="pitchVal">0</span>
                </div>
            </div>

            <div class="form-group">
                <label>KERAS SUARA (%)</label>
                <div class="slider-container">
                    <input type="range" id="volumeSlider" min="-30" max="30" value="0">
                    <span class="slider-value" id="volumeVal">0</span>
                </div>
            </div>

            <div class="form-group">
                <label for="textInput">TEKS UNTUK DIUCAPKAN:</label>
                <textarea id="textInput" placeholder="Halo semuanya yg ada disini apa kabar?"></textarea>
            </div>

            <div class="form-group">
                <label for="apiKeyInput">Gemini API Key (Opsional, jika ingin perbaikan naskah AI):</label>
                <input type="text" id="apiKeyInput" placeholder="Kosongkan jika pakai env server">
            </div>

            <button id="generateBtn" onclick="generateVoice()">Generasikan Voice Over</button>

            <div class="audio-result">
                <h3>HASIL VOICE OVER STUDIO</h3>
                <div id="statusMsg" class="status-msg">Siap generate...</div>
                <audio id="audioPlayer" controls style="display:none;"></audio>
            </div>
        </div>
    </div>

    <script>
        // Update label slider nilai real-time
        function setupSlider(sliderId, valId) {
            const slider = document.getElementById(sliderId);
            const val = document.getElementById(valId);
            slider.addEventListener('input', () => {
                val.textContent = (slider.value > 0 ? '+' : '') + slider.value;
            });
        }
        setupSlider('speedSlider', 'speedVal');
        setupSlider('pitchSlider', 'pitchVal');
        setupSlider('volumeSlider', 'volumeVal');

        async function generateVoice() {
            const btn = document.getElementById('generateBtn');
            const statusMsg = document.getElementById('statusMsg');
            const audioPlayer = document.getElementById('audioPlayer');

            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                alert('Mohon isi teks terlebih dahulu!');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Memproses...';
            statusMsg.textContent = 'Menghubungkan ke server voice over...';
            audioPlayer.style.display = 'none';

            try {
                const payload = {
                    text: text,
                    character: document.getElementById('characterSelect').value,
                    emotion: document.getElementById('emotionSelect').value,
                    speed_mod: parseInt(document.getElementById('speedSlider').value),
                    pitch_mod: parseInt(document.getElementById('pitchSlider').value),
                    volume_mod: parseInt(document.getElementById('volumeSlider').value),
                    gemini_api_key: document.getElementById('apiKeyInput').value.trim()
                };

                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                
                audioPlayer.src = audioUrl;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
                statusMsg.textContent = 'Selesai! Audio berhasil diputar.';
            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'Error: Gagal generate audio.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generasikan Voice Over';
            }
        }
    </script>
</body>
</html>
